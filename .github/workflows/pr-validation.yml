name: pr-validation

# Validate TechAPI PRs with TechEngine and report the result back as PR
# comments. Data changes get engine data checks; homepage changes get the
# TechAPI site build check. TechEngine's workflow runs here as a reusable
# workflow, so it uses this repo's GITHUB_TOKEN and comments as
# github-actions[bot] (ADR-017: no personal or bot-account tokens).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "data/**"
      - "site/public/v1/**"
      - "site/public/openapi.json"
      - "site/src/**"
      - "site/public/**"
      - "site/astro.config.*"
      - "site/package.json"
      - "site/package-lock.json"
      - "app/validate.py"
      - "app/verify/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.repository == 'GetTechAPI/TechAPI'
    uses: GetTechAPI/TechEngine/.github/workflows/techapi-pr-validation-comment.yml@main
    with:
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      head_ref: ${{ github.event.pull_request.head.ref }}
      base_ref: ${{ github.event.pull_request.base.ref }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      pr_url: ${{ github.event.pull_request.html_url }}
      requested_by: ${{ github.event.pull_request.user.login }}
