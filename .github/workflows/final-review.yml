name: final-review

# Type `/final-review` on an important PR to have TechEngineBot post its final
# check: one comment per PR (edited in place on re-runs) summarizing the checks
# on the PR head. This is the only place the TechEngineBot account is used, and
# only when a maintainer asks (ADR-017). Everything is read with this repo's
# GITHUB_TOKEN; TECHENGINEBOT_TOKEN (a fine-grained token limited to this repo,
# Pull requests: write) is used for the single comment and nothing else.
# PR code is never checked out or run here.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: final-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  final-review:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'GetTechAPI/TechAPI' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/final-review') &&
      contains(fromJSON('["OWNER","MEMBER"]'), github.event.comment.author_association)
    env:
      BOT_TOKEN: ${{ secrets.TECHENGINEBOT_TOKEN }}
    steps:
      - name: Summarize PR checks
        id: summary
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;
            const pr = (await github.rest.pulls.get({ owner, repo, pull_number })).data;
            const runs = await github.paginate(github.rest.checks.listForRef, {
              owner, repo, ref: pr.head.sha, per_page: 100,
            });
            const ok = new Set(['success', 'skipped', 'neutral']);
            const rows = runs
              .filter((r) => !r.name.startsWith('final-review'))
              .sort((a, b) => a.name.localeCompare(b.name))
              .map((r) => {
                const state = r.status !== 'completed' ? 'pending' : r.conclusion;
                const mark = state === 'pending' ? '⏳' : ok.has(state) ? '✅' : '❌';
                return { mark, line: `| ${mark} | [${r.name}](${r.html_url}) | ${state} |` };
              });
            let verdict;
            if (rows.some((r) => r.mark === '❌')) verdict = '❌ Not ready: a check failed';
            else if (rows.some((r) => r.mark === '⏳')) verdict = '⏳ Not ready: checks still running';
            else if (rows.length === 0) verdict = '⚠️ No checks ran on this commit';
            else verdict = '✅ Ready to merge';
            const body = [
              '<!-- techenginebot-final-review -->',
              `## TechEngineBot final review: ${verdict}`,
              '',
              `- Commit: \`${pr.head.sha.slice(0, 7)}\` (${pr.commits} commits, ${pr.changed_files} files, +${pr.additions}/-${pr.deletions})`,
              `- Mergeable: ${pr.mergeable_state}`,
              `- Requested by @${context.payload.comment.user.login}`,
              '',
              '| | Check | Result |',
              '| --- | --- | --- |',
              ...rows.map((r) => r.line),
            ].join('\n');
            core.setOutput('body', body);
            await core.summary.addRaw(body).write();

      - name: Post as TechEngineBot
        if: env.BOT_TOKEN != ''
        uses: actions/github-script@v7
        env:
          BODY: ${{ steps.summary.outputs.body }}
        with:
          github-token: ${{ secrets.TECHENGINEBOT_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- techenginebot-final-review -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: process.env.BODY });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: process.env.BODY });
            }

      - name: Warn when TECHENGINEBOT_TOKEN is unset
        if: env.BOT_TOKEN == ''
        run: echo "::warning::TECHENGINEBOT_TOKEN is not set; the final review is in the job summary only."
