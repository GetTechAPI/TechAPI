name: "📥 Data addition"
description: Request a record that is missing from the dataset
labels: ["type:data", "data:missing"]
body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - brand
        - soc
        - cpu
        - gpu
        - smartphone
        - tablet
        - watch
        - pda
        - laptop
        - monitor
        - device_catalog
        - software
        - website
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: "Galaxy S25 FE"
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Source URLs (at least one)
      description: The manufacturer's product page or datasheet is preferred; a Wikipedia article also works.
    validations:
      required: true
