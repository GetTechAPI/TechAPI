name: collect
# open-collect-pr.sh takes the task from this title, which the run can't change.
run-name: "collect ${{ inputs.task }}${{ inputs.task == 'ingest' && format(' {0}', inputs.category) || '' }}"

# Runs one of TechEngine's collectors by hand, on develop:
#   ingest   drafts new SKUs for one category from upstream catalogs
#   refresh  re-scrapes the benchmark sources into existing records
#   promote  runs the network verification (Tiers 1-3) and, with apply, flips
#            `verified` on the records that pass
# Nothing here runs on a schedule, pushes, opens a PR or posts a comment, and
# the engine that runs is the TechEngine commit this repository pins as its
# submodule.
#
# The token is read-only. A run commits its data changes locally, runs the
# validators and the integrity gate, and uploads the commit as collect.patch in
# a collect-* artifact. A maintainer then opens the PR from their own account:
#   bash .github/scripts/open-collect-pr.sh <run-id>
# so pr-checks runs on it like on any PR. Each task keeps at most one open PR,
# on a fixed collect/* branch that the script force-pushes and whose body it
# edits in place. Add the `final-check` label for the full build and the
# Tier 0-3 verification.
#
# The TechEngine workflows are pinned by commit SHA; bump it together with the
# submodule.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Collector to run"
        type: choice
        options: [ingest, refresh, promote]
        default: ingest
      category:
        description: "ingest: category"
        type: choice
        options: [cpu, gpu, smartphone]
        default: cpu
      limit:
        description: "ingest: max candidates per source"
        type: string
        default: "50"
      include_drafts:
        description: "ingest: also write incomplete records (the PR opens as a draft)"
        type: boolean
        default: false
      sleep:
        description: "refresh: seconds between requests"
        type: string
        default: "1.0"
      apply:
        description: "promote: flip verified and upload the patch (otherwise a dry run)"
        type: boolean
        default: false
      max_urls:
        description: "promote: records to URL-check"
        type: string
        default: "2000"
      max_wikidata:
        description: "promote: Wikidata items to check"
        type: string
        default: "20000"
      max_crossref:
        description: "promote: records to cross-reference"
        type: string
        default: "500"

permissions: {}

jobs:
  ingest:
    if: >-
      github.repository == 'GetTechAPI/TechAPI' && github.ref == 'refs/heads/develop' &&
      inputs.task == 'ingest'
    permissions:
      contents: read
    uses: GetTechAPI/TechEngine/.github/workflows/ingest.yml@0c5012b204ae2cb40685355f735fd74e46b236d7 # main, TechEngine #132
    with:
      category: ${{ inputs.category }}
      limit: ${{ inputs.limit }}
      include_drafts: ${{ inputs.include_drafts }}

  refresh:
    if: >-
      github.repository == 'GetTechAPI/TechAPI' && github.ref == 'refs/heads/develop' &&
      inputs.task == 'refresh'
    permissions:
      contents: read
    uses: GetTechAPI/TechEngine/.github/workflows/refresh.yml@0c5012b204ae2cb40685355f735fd74e46b236d7 # main, TechEngine #132
    with:
      sleep: ${{ inputs.sleep }}

  promote:
    if: >-
      github.repository == 'GetTechAPI/TechAPI' && github.ref == 'refs/heads/develop' &&
      inputs.task == 'promote'
    permissions:
      contents: read
    uses: GetTechAPI/TechEngine/.github/workflows/verify-promote.yml@0c5012b204ae2cb40685355f735fd74e46b236d7 # main, TechEngine #132
    with:
      apply: ${{ inputs.apply }}
      max_urls: ${{ inputs.max_urls }}
      max_wikidata: ${{ inputs.max_wikidata }}
      max_crossref: ${{ inputs.max_crossref }}
