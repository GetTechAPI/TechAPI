name: "✏️ Data correction"
description: Correct an existing spec value
labels: ["type:data", "data:incorrect"]
body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Slugs are unique only within a category.
      options:
        - brand
        - soc
        - cpu
        - gpu
        - smartphone
        - tablet
        - watch
        - pda
        - laptop
        - monitor
        - device_catalog
        - software
        - website
    validations:
      required: true
  - type: input
    id: slug
    attributes:
      label: Resource slug
      placeholder: "galaxy-s25"
    validations:
      required: true
  - type: input
    id: field
    attributes:
      label: Field to correct
      placeholder: "battery_mah"
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Current value → correct value (with source)
      placeholder: |
        current: 4500
        correct: 4000
        source: https://www.samsung.com/...
    validations:
      required: true
