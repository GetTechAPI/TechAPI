name: "🐛 Bug report"
description: Report a bug in the static API, the site or the validator
labels: ["type:bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the exact URL or command where possible.
      placeholder: |
        curl https://gettechapi.github.io/TechAPI/v1/smartphones/galaxy-s25/index.json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
